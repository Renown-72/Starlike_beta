l_english:
  # ===== Core Events (2-4) =====
  event_homing.2.title: "Stellar Dust Homeworld"
  event_homing.2.desc: "The planet designated Homing Earth — turned to stellar dust millennia ago — pulses with an anomalous signal unlike any we have encountered. Our ancient civilization, it seems, still lingers here."
  event_homing.2.opt.investigate: "Investigate the anomalous signal."
  event_homing.2.opt.defer: "Defer the investigation."

  event_homing.3.title: "Echoes of Home"
  event_homing.3.desc: "Our scientists have decoded fragments of the anomaly's transmission. It contains the architectural schematics of our ancestors — scattered across the void, waiting to be found. The archive is incomplete, but the knowledge within is invaluable."
  event_homing.3.opt.archive: "Archive the knowledge for future generations."
  event_homing.3.opt.decode: "Decode the schematics immediately."

  event_homing.4.title: "StarWhisper Legacy"
  event_homing.4.desc: "The full archive has been unlocked. Among the recovered data are records of a navigational beacon — a device capable of sensing anomalies across the galaxy. This is the legacy of the StarWhispers."
  event_homing.4.opt.accept: "Accept the legacy."
  event_homing.4.opt.decline: "Some knowledge is better left sealed."

  # Event Modifiers (core)
  homing_earth_memories: "Memories of Homing Earth"
  homing_earth_memories_desc: "Fragments of our ancestral archive have been recorded, bolstering unity and resolve."
  homing_legacy: "StarWhisper Legacy"
  homing_legacy_desc: "The decoded archive of Homing Earth grants enhanced research and unity through our shared heritage."

  # ===== Huisu Faction Events (5-7) =====
  event_homing.5.title: "Voices from the Archive"
  event_homing.5.desc: "Deep within the Huisu Museum archives, voices long silent begin to stir. The preserved records of our ancestors are not merely data—they speak, carrying dreams of the COPAN golden age. Our curators report: the resonance is growing stronger with each passing cycle."
  event_homing.5.opt.ancestors_speak: "Listen to what they have to say."
  event_homing.6.title: "The Archive Awakens"
  event_homing.6.desc: "The Huisu archives have fully awakened. Knowledge flows like water through our administrative networks, and our people feel a renewed connection to their heritage. The museum is no longer a static collection—it has become a living pillar of our civilization."
  event_homing.6.opt.integrate: "Integrate the awakened archive."
  event_homing.7.title: "Heritage and the Future"
  event_homing.7.desc: "As the archive resonance intensifies, voices from our past begin to merge with our present. Some curators warn of becoming lost in nostalgia, but the majority feel empowered by the weight of history behind them. We must choose how this heritage shapes our future."
  event_homing.7.opt.preserve: "Preserve what we have gained."

  # ===== Martis Faction Events (8-10) =====
  event_homing.8.title: "The First Discovery"
  event_homing.8.desc: "A breakthrough in our anomaly research channels has yielded an unexpected result—a fragment of ancient technology, pre-dating even the COPAN archives. The Martis scientists are energized: this could be evidence that our origins stretch further back than we believed."
  event_homing.8.opt.analyze: "Analyze the discovery."
  event_homing.9.title: "The Mars Flame Rekindled"
  event_homing.9.desc: "The fragment has been decoded, and it carries a pattern—the signature of the Mars reconstruction era. For the Martis faction, this is more than technology: it is the reawakening of a flame they thought lost to history. The effect on their morale is palpable."
  event_homing.9.opt.reignite: "Rekindle the flame."
  event_homing.10.title: "Beyond What Is Known"
  event_homing.10.desc: "With the Mars flame burning bright again, our scientists push forward with renewed vigor. Discoveries cascade, each one opening new questions. The boundary between known and unknown is thinning—and some whisper that what lies beyond may change everything."
  event_homing.10.opt.beyond: "Push past the boundary."

  # ===== Luanyu Faction Events (11-13) =====
  event_homing.11.title: "The Fleet Remembers"
  event_homing.11.desc: "During a routine patrol, ships of the Luanyu Fleet began broadcasting on all channels—not by command, but by what their crews describe as a collective memory. The transmission contains fragments of their original mission to Project Homing, long thought lost. The fleet has become something more than ships and sailors: it carries the weight of their exile."
  event_homing.11.opt.honor: "Honor their memory."
  event_homing.12.title: "Iron Discipline, Living Memory"
  event_homing.12.desc: "The fleet-wide broadcast has been analyzed. It is not a malfunction but a manifestation: the Luanyu ships, forged in the crucible of the Sol explosion, remember what they were built for. Iron discipline alone could not sustain them through the centuries—but discipline plus shared purpose has. The fleet has evolved."
  event_homing.12.opt.strengthen: "Strengthen what has emerged."
  event_homing.13.title: "The Return Promise"
  event_homing.13.desc: "The Luanyu Fleet stands ready. Their discipline is sharper than ever, and their purpose has been renewed by the memory of their exile. They no longer fight merely for survival—they fight to fulfill a promise made before any of them were born. The path home lies before them."
  event_homing.13.opt.lead: "Lead them home."

  # ===== Convergence Events (14-16) =====
  event_homing.14.title: "The Three Bloodlines Converge"
  event_homing.14.desc: "The strands of Huisu heritage, Martis research, and Luanyu strength have woven together. The Ranshanxia bloodline—named after the atmospheric phenomenon that once warmed the skies of our ancestors—now flows through every COPAN citizen. We are no longer exiles seeking home: we are the inheritors of destiny itself."
  event_homing.14.opt.convergence: "Embrace the convergence."
  event_homing.15.title: "Homing Realized"
  event_homing.15.desc: "The convergence of the three bloodlines has done something the COPAN founders never imagined: it has healed the rupture in our people's soul. The thousand-year exile is not forgotten—how could it be?—but it no longer defines us. We are no longer the survivors of Sol, fleeing into the dark. We stand as one people, carrying three visions toward a single dawn."
  event_homing.15.opt.realization: "Embrace the truth."
  event_homing.16.title: "Homing Complete"
  event_homing.16.desc: "The Project Homing has fulfilled its purpose. The COPAN civilization has found what they never lost: a home among the stars, worthy of their ancestors and their children. The journey is not over—the universe is vast—but for the first time in a millennium, we do not wander alone."
  event_homing.16.opt.closure: "Look to the future."

  # ===== Event 17 =====
  event_homing.17.title: "A New Dawn"
  event_homing.17.desc: "It is done. The stellar dust has cleared, oceans have returned, and the sky is blue once more. Earth — not as it was, but as it could be — stands reborn beneath the stars. A thousand years of exile end not with a homecoming, but with a creation. We have not returned to the old world. We have built a new one."
  event_homing.17.opt.new_dawn: "Welcome home."

  # ===== Faction Modifiers =====
  modifier_huisu_heritage_resonance: "Heritage Resonance"
  modifier_huisu_heritage_resonance_desc: "The awakened archives of the Huisu Museum flow through our administration, strengthening research and unity."
  modifier_martis_breakthrough: "Scientific Breakthrough"
  modifier_martis_breakthrough_desc: "A discovery from before the COPAN era has accelerated our research programs and enhanced anomaly analysis."
  modifier_phoenix_fleet_readiness: "Fleet Readiness"
  modifier_phoenix_fleet_readiness_desc: "The Luanyu Fleet operates with renewed purpose, increasing naval capacity and weapon effectiveness."
  modifier_ranshanxia_destiny_woven: "Destiny Woven"
  modifier_ranshanxia_destiny_woven_desc: "The three bloodlines begin to merge, granting broad improvements across all domains."
  modifier_homing_convergence_echoes: "Homing Echoes"
  modifier_homing_convergence_echoes_desc: "The echoes of our ancestors' journey permanently strengthen our civilization in all aspects."

  # ===== Event Chains =====
  sl_chain_earth_legacy: "Legacy of Earth"
  sl_chain_earth_legacy_desc: "Uncover the secrets of the stellar-dust Earth and reclaim the heritage of Sol."
  sl_chain_faction_story: "Faction Chronicles"
  sl_chain_faction_story_desc: "The story of your chosen faction unfolds as the civilization matures."
  sl_chain_convergence: "The Convergence"
  sl_chain_convergence_desc: "The three bloodlines of COPAN civilization converge toward a shared destiny."

  # ===== v0.5 Bloodline Events =====
  sl_bloodline.500.title: "Fall of the Stellarite Speaker"
  sl_bloodline.500.desc: "The last Stellarite Speaker has fallen. No final words — only a resonance that pierced the void, as if the stars themselves wept.\n\nThe three faction leaders stand in the ruined council hall, facing each other in tense silence. Without the Speaker's unifying presence, the empire faces its greatest crisis. You must choose one to carry on."
  sl_bloodline.500.opt.huisu: "Appoint the Huisu Councilor"
  sl_bloodline.500.opt.huisu.tt: "The Huisu Councilor becomes ruler. §G+Unity§!"
  sl_bloodline.500.opt.martis: "Appoint the Martis Director"
  sl_bloodline.500.opt.martis.tt: "The Martis Director becomes ruler. §G+Physics Research§!"
  sl_bloodline.500.opt.phoenix: "Appoint the Luanyu Commander"
  sl_bloodline.500.opt.phoenix.tt: "The Luanyu Commander becomes ruler. §G+Alloys§!"

  # ===== SL_BIGE 传奇科学家 =====
  sl_bige_catch.10.t: "Bige"
  sl_bige_catch.10.d: "Before you stands your daughter — or rather, what she has become. Bige, the girl who once tugged at your sleeve during the Mars reconstruction, now radiates the quiet confidence of a legendary scientist. 'Father... I've been waiting for this moment.'"
  sl_bige_catch.hire.tt: "Add Bige to your council."
  sl_bige_catch.dismiss.tt: "Send Bige away."
  sl_bige_catch.intro.r: "Father, the stars... they sing to me now. Just like Mother described in her journals."
  sl_bige_catch.join.r: "I've waited so long to fight beside you again."
  sl_bige_catch.criticize.r: "Father, violence is never the answer. Though I understand why you might think so."
  sl_bige_catch.praise.r: "The sword is your heritage. I will honor that, Father."

  sl_bige_chat.10.t: "Bige"
  sl_bige_chat.d.1: "Father... it's been too long."
  sl_bige_chat.d.2: "I still remember the smell of Olympus Mons dust in your jacket."
  sl_bige_chat.d.3: "Sometimes I dream of Sol. The blue sky... it's fading from memory."
  sl_bige_chat.d.4: "About Mother... I've been sensing her presence in the stellar winds."
  sl_bige_chat.d.5: "The Phoenix Plume fleet whispers of rebellion. I worry for you, Father."
  sl_bige_chat.d.6: "There's something beneath Europa's ice. I can feel it, Father."
  sl_bige_chat.d.7: "Father, I can hear the stars now. They're not just light — they're voices."

  sl_bige_chat.thoughts.d: "What weighs on your mind, Father?"
  sl_bige_chat.thoughts: "Thoughts"
  sl_bige_chat.thoughts.player.d.1: "You're carrying something heavy, Father. I can see it in your eyes."
  sl_bige_chat.thoughts.player.d.2: "Your burden is mine to share. That's what family means."
  sl_bige_chat.thoughts.player: "I have something to share."

  sl_bige_cmt.survey: "Another world catalogued. We're one step closer to understanding our origins."
  sl_bige_cmt.survey.2: "The scanner pings. Each planet tells a story, Father."
  sl_bige_cmt.anomaly: "An anomaly! Father, this signal... it feels like Mother's research."
  sl_bige_cmt.anomaly.2: "The readings are off the charts. I've never seen energy signatures like this."
  sl_bige_cmt.scanner: "Another sector scanned. The galaxy is slowly giving up its secrets."
  sl_bige_cmt.scanner.2: "Father, the data is compiling. There's a pattern emerging."

  sl_bige_opinion.title: "Bige's Trust"
