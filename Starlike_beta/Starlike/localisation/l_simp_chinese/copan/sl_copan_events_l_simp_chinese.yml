l_simp_chinese:
  # ===== 核心事件 (2-4) =====
  event_homing.2.title: "星尘故土"
  event_homing.2.desc: "被命名为"归巢地球"的星球——早在千年前便已化作星尘——此刻正在发出一种前所未见的异常信号。我们古老的文明，似乎仍有残留在此处。"
  event_homing.2.opt.investigate: "调查异常信号。"
  event_homing.2.opt.defer: "推迟调查。"

  event_homing.3.title: "故土回响"
  event_homing.3.desc: "我们的科学家已解码了异常信号的部分内容。其中包含着我们先祖的建筑蓝图——散落在虚空中，等待着被发现。档案并不完整，但其中的知识弥足珍贵。"
  event_homing.3.opt.archive: "将知识归档，惠及后世。"
  event_homing.3.opt.decode: "立即解码蓝图。"

  event_homing.4.title: "星语者遗产"
  event_homing.4.desc: "完整档案已被解锁。在回收的数据中，包含一座导航信标的记录——一种能够感知全星系异常的装置。这便是星语者的遗产。"
  event_homing.4.opt.accept: "接受这份遗产。"
  event_homing.4.opt.decline: "有些知识，还是封存为好。"

  # 事件修正（核心）
  homing_earth_memories: "归巢地球的记忆"
  homing_earth_memories_desc: "先祖档案的碎片已被记录，强化了凝聚力与信念。"
  homing_legacy: "星语者遗产"
  homing_legacy_desc: "解码归巢地球档案获得的遗产，通过共同的传承提升了研究与凝聚力。"

  # ===== 辉夙派系事件 (5-7) =====
  event_homing.5.title: "档案中的回响"
  event_homing.5.desc: "辉夙博物馆深处的档案中，沉寂已久的声音开始骚动。我们保存的先祖记录不仅是数据——它们在诉说，承载着汉和黄金时代的梦想。我们的馆长报告：共鸣正在每个周期不断增强。"
  event_homing.5.opt.ancestors_speak: "聆听它们要说的话。"
  event_homing.6.title: "档案觉醒"
  event_homing.6.desc: "辉夙档案已完全觉醒。知识如水般流经我们的行政网络，我们的人民感到与遗产的联结焕然一新。博物馆不再是静态藏品——它已成为我们文明的活支柱。"
  event_homing.6.opt.integrate: "整合觉醒的档案。"
  event_homing.7.title: "遗产与未来"
  event_homing.7.desc: "随着档案共鸣加剧，来自过去的声息开始与当下交融。部分馆长警告说会迷失于怀旧，但多数人因背负的历史重量而感到振奋。我们必须选择这段遗产如何塑造我们的未来。"
  event_homing.7.opt.preserve: "守护我们所获。"

  # ===== 荧惑派系事件 (8-10) =====
  event_homing.8.title: "首次发现"
  event_homing.8.desc: "我们的异常研究渠道取得突破——得到一枚远古技术碎片，其年代甚至早于汉和档案。荧惑科学家们振奋不已：这可能是我们起源比已知更久远的证据。"
  event_homing.8.opt.analyze: "分析这一发现。"
  event_homing.9.title: "火星之焰重燃"
  event_homing.9.desc: "碎片已解码，并携带一种模式——火星重建时期的印记。对荧惑派而言，这不只是技术：这是他们认为已逝于历史的星火重燃。对其士气的影响肉眼可见。"
  event_homing.9.opt.reignite: "重燃星火。"
  event_homing.10.title: "跨越已知"
  event_homing.10.desc: "火星之焰炽热重燃，科学家们以焕然一新的活力向前推进。发现如潮水般涌来，每一项都开启新的疑问。已知与未知的边界正在变薄——有人低语说，边界之外的一切或将改变一切。"
  event_homing.10.opt.beyond: "跨越边界。"

  # ===== 鸾羽派系事件 (11-13) =====
  event_homing.11.title: "舰队记忆"
  event_homing.11.desc: "在一次例行巡逻中，鸾羽舰队的战舰开始在所有频道广播——不是奉命，而是乘员们描述为集体记忆。传输包含着它们执行归巢计划原始使命的碎片，本认为早已失落。舰队已不再只是战舰与水兵——它们背负着流亡的重量。"
  event_homing.11.opt.honor: "致敬这份记忆。"
  event_homing.12.title: "铁律与活着的记忆"
  event_homing.12.desc: "舰队范围的广播已被解析。这不是故障而是显化：鸾羽战舰在太阳爆炸的熔炉中锻造，记得它们为何而建。仅凭铁律无法支撑它们走过数世纪——但铁律加上共同目的可以。舰队已进化。"
  event_homing.12.opt.strengthen: "强化所浮现者。"
  event_homing.13.title: "归巢的承诺"
  event_homing.13.desc: "鸾羽舰队整装待发。它们的纪律比以往任何时候都锋利，其使命因流亡记忆而焕然一新。它们不再只为生存而战——它们为履行出生前的承诺而战。归途在前。"
  event_homing.13.opt.lead: "领它们归巢。"

  # ===== 汇聚链事件 (14-16) =====
  event_homing.14.title: "三脉汇聚"
  event_homing.14.desc: "辉夙的遗产、荧惑的科研、鸾羽的力量在此交织。染山霞血脉——以曾经温暖先祖苍穹的大气现象命名——此刻流经每一位汉和公民。我们不再是寻求归巢的流亡者：我们是命运本身的继承者。"
  event_homing.14.opt.convergence: "拥抱汇聚。"
  event_homing.15.title: "归巢成真"
  event_homing.15.desc: "三脉汇聚完成了汉和创想者从未设想之事：它治愈了我们民族灵魂的裂痕。千年的流亡从未被遗忘——怎么可能遗忘？——但它不再定义我们。我们不再是逃离黑暗的太阳系幸存者。我们作为一体民族，承载三种愿景走向同一黎明。"
  event_homing.15.opt.realization: "拥抱真理。"
  event_homing.16.title: "归巢完成"
  event_homing.16.desc: "归巢计划已达成其目的。汉和文明找到了它们从未失去之物：群星中配得上先祖与子孙的家园。旅程未终——宇宙浩瀚——但千年来第一次，我们不再独自流浪。"
  event_homing.16.opt.closure: "展望未来。"

  # ===== 事件 17 =====
  event_homing.17.title: "新的黎明"
  event_homing.17.desc: "完成了。星尘散尽，海洋重现，天空再次湛蓝。地球——不是它曾经的样子，而是它可以成为的样子——在群星下重生。千年流亡的终点不是归乡，而是创造。我们没有回到旧世界。我们建造了一个新的。"
  event_homing.17.opt.new_dawn: "欢迎回家。"

  # ===== 派系修正器 =====
  modifier_huisu_heritage_resonance: "遗产共鸣"
  modifier_huisu_heritage_resonance_desc: "辉夙博物馆的觉醒档案流经我们的行政体系，强化科研与凝聚力。"
  modifier_martis_breakthrough: "科研突破"
  modifier_martis_breakthrough_desc: "来自汉和时代之前的发现加速了我们的科研项目并增强了异常解析能力。"
  modifier_phoenix_fleet_readiness: "舰队整备"
  modifier_phoenix_fleet_readiness_desc: "鸾羽舰队以焕然一新的使命运作，提升海军容量与武器效能。"
  modifier_ranshanxia_destiny_woven: "命运交织"
  modifier_ranshanxia_destiny_woven_desc: "三条血脉开始融合，在所有领域给予广泛提升。"
  modifier_homing_convergence_echoes: "归巢回响"
  modifier_homing_convergence_echoes_desc: "先祖旅程的回响永久强化我们文明的所有面向。"

  # ===== 事件链 =====
  sl_chain_earth_legacy: "地球遗产"
  sl_chain_earth_legacy_desc: "揭开星尘化地球的秘密，重拾太阳系的遗产。"
  sl_chain_faction_story: "派系编年史"
  sl_chain_faction_story_desc: "你所选择的派系故事随文明的成熟而展开。"
  sl_chain_convergence: "汇聚"
  sl_chain_convergence_desc: "汉和文明的三脉血脉汇聚，走向共同的命运。"

  # ===== v0.5 血脉事件 =====
  sl_bloodline.500.title: "星语者陨落"
  sl_bloodline.500.desc: "最后的星语者倒下了。没有遗言——只有一声穿透虚空的共鸣，仿佛恒星本身在哀鸣。\n\n三大派系的领袖在废墟般的议事厅中对峙，沉默而紧张。没有了星语者的凝聚力，帝国面临前所未有的危机。你必须从中选择一人，继续带领这个文明。"
  sl_bloodline.500.opt.huisu: "委任辉夙议长"
  sl_bloodline.500.opt.huisu.tt: "辉夙议长成为统治者。§G+凝聚力§!"
  sl_bloodline.500.opt.martis: "委任荧惑总监"
  sl_bloodline.500.opt.martis.tt: "荧惑总监成为统治者。§G+物理研究§!"
  sl_bloodline.500.opt.phoenix: "委任鸾羽总长"
  sl_bloodline.500.opt.phoenix.tt: "鸾羽总长成为统治者。§G+合金§!"

  # ===== SL_BIGE 传奇科学家 =====
  sl_copan_bige_name: "大E"
  sl_bige_catch.10.t: "大E"
  sl_bige_catch.10.d: "站在你面前的是科学官派系——荧惑派的领袖，她负责攻坚了"爸爸……这一刻我等了很久。""
  sl_bige_catch.hire.tt: "让大E加入你的内阁。"
  sl_bige_catch.dismiss.tt: "让大E离开。"
  sl_bige_catch.intro.r: "爸爸，星星们……它们现在在对我唱歌了。就像妈妈日记里描述的那样。"
  sl_bige_catch.join.r: "我等了很久，终于能再次与你并肩作战了。"
  sl_bige_catch.criticize.r: "爸爸，暴力从来不是答案。不过我能理解你为什么会这么想。"
  sl_bige_catch.praise.r: "剑是你的传承。我会尊重这一点，爸爸。"

  sl_bige_chat.10.t: "大E"
  sl_bige_chat.d.1: "爸爸……太久了。"
  sl_bige_chat.d.2: "我仍然记得你夹克上奥林帕斯山的尘土味道。"
  sl_bige_chat.d.3: "有时我梦见太阳系。那片蓝天……正在从记忆中消退。"
  sl_bige_chat.d.4: "关于妈妈……我一直在恒星风中感应到她的存在。"
  sl_bige_chat.d.5: "鸾羽舰队中有人密谋叛乱。爸爸，我很担心你。"
  sl_bige_chat.d.6: "欧罗巴的冰层下有东西。爸爸，我能感应到它。"
  sl_bige_chat.d.7: "爸爸，我能听到星星的声音了。它们不只是光——它们是声音。"

  sl_bige_chat.thoughts.d: "爸爸，什么事让你心事重重？"
  sl_bige_chat.thoughts: "想法"
  sl_bige_chat.thoughts.player.d.1: "你承受着某种重担，爸爸。我能从你的眼神里看出来。"
  sl_bige_chat.thoughts.player.d.2: "你的负担也是我的。这是家人的意义。"
  sl_bige_chat.thoughts.player: "我有话想说。"

  sl_bige_cmt.survey: "又一颗星球编目。我们离了解自己的起源又近了一步。"
  sl_bige_cmt.survey.2: "扫描仪响了。每颗行星都在诉说着自己的故事，爸爸。"
  sl_bige_cmt.anomaly: "异常！爸爸，这个信号……它让我想起妈妈的研究。"
  sl_bige_cmt.anomaly.2: "读数爆表了。我从未见过这种能量特征。"
  sl_bige_cmt.scanner: "又一个扇区扫描完毕。星系正在慢慢交出它的秘密。"
  sl_bige_cmt.scanner.2: "爸爸，数据正在汇编。有一种模式正在浮现。"

  sl_bige_opinion.title: "大E的信任"
