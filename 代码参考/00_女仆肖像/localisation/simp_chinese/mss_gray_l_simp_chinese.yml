l_simp_chinese:
 #小灰
 mss_gray.10.t: "$NAME_Gray$，但是有些美味"
 mss_gray.10.d: "嗨！我最近在观察了宇宙中的那些神奇的美味女仆，她们实在是太美味了，我决定模仿一下她们的形态，你觉得怎么样？"
 mss_gray.10.yes: "[[§G确认§!]    太好了，就喜欢美味的。"
 mss_gray.10.yes.tt: "§Y$NAME_Gray$将一直保持美味女仆的形态§!\n她会在以下情况尝试变身：\n    -在外交通讯中与她交谈 \n    -每年元旦后1天 \n    -作为领袖被任命至某处 \n    -作为领袖被解任 \n    -变成$ethic_gestalt_consciousness$领袖后的一天 \n不会对没有§Hgray_leader§!旗帜的领袖生效 \n$mss_gray_eula$"
 mss_gray_eula: "\n§Y免责声明：§!\n只会更改领袖肖像，以下情况均与本MOD§H无关§!：\n    小灰领袖特质、数据出错 \n    小灰老死、失踪、被抓走、解剖、叛变等 \n    小灰国、舰船、陆军、事件出错 \n    小灰领袖肖像以外的任何东西出错 \n    L星团开不出小灰、任何涉及概率的问题 \n    闪退、卡、定时卡死、失去同步 \n    其他MOD除了小灰肖像外的任何错误 \n    买不起遥远繁星DLC、不会安装MOD、不会卸载MOD等。"
 mss_gray.10.no: "[[§R拒绝§!]    不用了。"
 mss_gray.10.no.tt: "§Y拒绝$NAME_Gray$§!\n§R选择的机会只有一次§!\n本事件没有改变小灰的肖像"
 
 mss_gray.portrait.set: "[[皮肤]"
 mss_gray.portrait.wings: "§v有翼§!"
 mss_gray.portrait.wingless: "§g无翼§!"
 
 mss_gray.portrait.random: "$mss_gray.portrait.set$    随机组件组合    $mss_gray.portrait.wings$"
 mss_gray.portrait.random.wingless: "$mss_gray.portrait.set$    随机组件组合    $mss_gray.portrait.wingless$"
 mss_gray.portrait.response.random: "在这个形象中，小灰每次变身时会随机组合所有可能的肖像组件，独特的组件也在随机范围内。"
 
 mss_gray.portrait.default: "$mss_gray.portrait.set$    美味女仆标准款    $mss_gray.portrait.wings$"
 mss_gray.portrait.default.wingless: "$mss_gray.portrait.set$    美味女仆标准款    $mss_gray.portrait.wingless$"
 mss_gray.portrait.response.default: "美味女仆的灰色女仆标准形态。"
 
 mss_gray.portrait.classic: "$mss_gray.portrait.set$    2019经典款    $mss_gray.portrait.wings$"
 mss_gray.portrait.classic.wingless: "$mss_gray.portrait.set$    2019经典款    $mss_gray.portrait.wingless$"
 mss_gray.portrait.response.classic: "某些人对小灰的定向期待，原设计者：§HEAGERllier§!，纳粹元素被替换为红色高棉。"
 
 mss_gray.portrait.loji: "$mss_gray.portrait.set$    旧地球典藏款    $mss_gray.portrait.wings$"
 mss_gray.portrait.loji.wingless: "$mss_gray.portrait.set$    旧地球典藏款    $mss_gray.portrait.wingless$"
 mss_gray.portrait.response.loji: "从古地球时代东方大国里找到的某个虚拟角色，似乎跟AI和超级计算机有关，名字以Lo开头。小灰说她出的是洛天依，和以往一样，小灰根本不了解角色就出COSPLAY了。"