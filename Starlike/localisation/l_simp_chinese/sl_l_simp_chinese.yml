  #起源相关汉化
  origin_homing: "归巢计划"
  origin_homing_desc: "征途千年一日，未敢忘其初源；我辈命之所属，定还尔汝新天。“江东子弟今虽在，肯与君王卷土来？” \n$SL_LABEL$"
  origin_tooltip_projece_homing_effects: "星语者血脉赋予我们对宇宙的敏锐感知：异常更易发现与解析。勘测船更快穿越未知星域。失落母星的零散知识加速科研。可用额外一个科技替代方案。"
  origin_tooltip_project_homing_negative_effects: "漫长的流亡让我们付出沉重代价：领袖储备池枯竭，可供选拔的指挥官与科学家更少。"

  #恒星系相关汉化
  homing_earth_NAME: "归巢计划地球"
  homing_earth_DESC: "这将是选择归巢计划起源时的起始恒星系。\n\n决定你的一开始的恒星系的布局，但并不确定其具体位置。\n$SL_LABEL$"
  NAME_Homing_Earth: "星尘化地球"

  #国策相关汉化

  # 事件链相关
  event_homing.2.title: "星尘故土"
  event_homing.2.desc: "被命名为"归巢地球"的星球——早在千年前便已化作星尘——此刻正在发出一种前所未见的异常信号。我们古老的文明，似乎仍有残留在此处。"
  event_homing.2.opt.investigate: "调查异常信号。"
  event_homing.2.opt.defer: "推迟调查。"

  event_homing.3.title: "故土回响"
  event_homing.3.desc: "我们的科学家已解码了异常信号的部分内容。其中包含着我们先祖的建筑蓝图——散落在虚空中，等待着被发现。档案并不完整，但其中的知识弥足珍贵。"
  event_homing.3.opt.archive: "将知识归档，惠及后世。"
  event_homing.3.opt.decode: "立即解码蓝图。"

  event_homing.4.title: "星语者遗产"
  event_homing.4.desc: "完整档案已被解锁。在回收的数据中，包含一座导航信标的记录——一种能够感知全星系异常的装置。这便是星语者的遗产。"
  event_homing.4.opt.accept: "接受这份遗产。"
  event_homing.4.opt.decline: "有些知识，还是封存为好。"

  # 专属修正
  homing_earth_memories: "归巢地球的记忆"
  homing_earth_memories_desc: "先祖档案的碎片已被记录，强化了凝聚力与信念。"
  homing_legacy: "星语者遗产"
  homing_legacy_desc: "解码归巢地球档案获得的遗产，通过共同的传承提升了研究与凝聚力。"

  # 专属科学家特质
  trait_scientist_stellarite_touched: "星尘感应者"
  trait_scientist_stellarite_touched_desc: "被先祖的星尘所触及，这位科学家对宇宙异常有超乎常人的感知。"

  # COPAN 派系国策
  civic_huisu: "辉夙正统"
  civic_huisu_desc: "归巢计划的核心船员群体，以辉夙中央的行政官、事务员为主。他们以传承与治理效率为执政重心，在漫长的重建年代中维系着文明的记忆与认同。"
  civic_huisu_effects: "§H+25%§! 考古速度\n§H+15%§! 遗珍能量产出\n§H+15%§! 凝聚力产出\n§H+10§! 法令基金\n§R-10%§! 舰船容量"
  civic_huisu_negative_effects: ""
  civic_martis: "荧惑崛起"
  civic_martis_desc: "在火星重建时期异军突起的科学官群体。星火相传，荧荧不灭。其支持者自称荧惑派，以集体智慧引领文明存续。"
  civic_martis_effects: "§H+10%§! 科研速度\n§H+20%§! 勘测速度\n§H+20%§! 异常研究速度\n§R-1§! 领袖储备容量"
  civic_martis_negative_effects: ""
  civic_phoenix_plume: "鸾羽政变"
  civic_phoenix_plume_desc: "汉和星舰中央为监视归巢计划所派遣的武装力量，名义上归汉和辉夙中央管辖。意外降临群星位面后，他们以铁律武力护佑文明，崇尚军事秩序与力量。"
  civic_phoenix_plume_effects: "§H+20%§! 舰船容量\n§H+25%§! 领袖经验获取\n§H+15%§! 陆军伤害\n§R-5%§! 凝聚力产出"
  civic_phoenix_plume_negative_effects: ""
  councilor_huisu: "辉夙委员"
  councilor_huisu_desc: "辉夙委员统筹一体汉和的行政事务，代表一体汉和文明的价值观。"
  councilor_martis: "荧惑科学总监"
  councilor_martis_desc: "荧惑科学总监领导一体汉和的科研使命，承继火星重建时期的科学遗产。"
  councilor_phoenix_plume: "鸾羽舰队总长"
  councilor_phoenix_plume_desc: "鸾羽舰队总长指挥一体汉和的军事力量，体现鸾羽号的铁律武力传统。"

  # 异常 — 归巢地球星尘
  anomaly_homing_earth_stardust_desc: "这颗曾被称为"地球"的星球，已变成了一颗恒星，微弱的能量信号从中脉动，仿佛星球仍记得它曾经的模样。"

  # 内阁议程
  council_agenda_agenda_huisu_name: "文物归档"
  council_agenda_agenda_huisu_desc: "优先进行档案回收与文化遗产保护。将资源集中于考古研究和通过共同历史凝聚人心。"
  council_agenda_agenda_martis_name: "科学先行"
  council_agenda_agenda_martis_desc: "加速所有科研项目和勘测行动。将火星重建时期的科学遗产转化为系统性的星系探索。"
  council_agenda_agenda_phoenix_plume_name: "军备扩张"
  council_agenda_agenda_phoenix_plume_desc: "扩充舰队容量，强化地面部队。鸾羽军令要求我们对一切威胁保持戒备。"

  # ===== 物种·汉和 =====
  SPECIES_homing_han: "一体汉和"
  trait_stellarite_adapted: "星尘适应"
  trait_stellarite_adapted_desc: "历经千年太空城与火星环境适应，此物种对极端环境有着卓越的耐受性，并以集体凝聚为本能。"
  trait_stellarite_touched: "寻根本能"

  # ===== 传统树 =====

  # ── 辉夙传统 ──
  tradition_huisu: "辉夙传统"
  tradition_huisu_desc: "辉夙博物传承的治理哲学：以行政重构维系秩序，以陆军传承守护遗产。"
  tr_huisu_adopt: "博物启典"
  tr_huisu_adopt_desc: "开启辉夙传承之路，以考古智慧指引文明复兴。"
  tr_huisu_finish: "万世博物"
  tr_huisu_finish_desc: "辉夙传承的终极成就：行政与武备的完美融合，开启文明的新纪元。"
  tr_huisu_admin_rebuild: "行政重构"
  tr_huisu_admin_rebuild_desc: "精简冗余的行政层级，以博物馆式的精确管理降低帝国运转的规模负担。"
  tr_huisu_cultural_unity: "文脉凝聚"
  tr_huisu_cultural_unity_desc: "将共同的流亡记忆转化为文明凝聚力的源泉，团结一切力量。"
  tr_huisu_edict_tradition: "敕令传统"
  tr_huisu_edict_tradition_desc: "恢复辉夙中央的敕令体系，以更低的成本颁布更多法令，维持高效治理。"
  tr_huisu_heritage_arms: "传承武备"
  tr_huisu_heritage_arms_desc: "辉夙卫队世代传承的近战格斗术与防御工事技艺，赋予陆军强悍的战斗力。"
  tr_huisu_relic_guardian: "守遗卫士"
  tr_huisu_relic_guardian_desc: "专门守护遗珍与档案的精锐卫队，在防御战中尤为凶悍。"

  # ── 荧惑传统 ──
  tradition_martis: "荧惑传统"
  tradition_martis_desc: "荧惑科学派的探索信条：以实验推动科研，以勘测拓展边疆。"
  tr_martis_adopt: "荧惑启程"
  tr_martis_adopt_desc: "踏上荧惑科学派的求知之路，以更快的勘测速度探索未知。"
  tr_martis_finish: "荧惑启明"
  tr_martis_finish_desc: "荧惑传统的终极成就：科研与探索的双重突破，照亮文明前行的道路。"
  tr_martis_experiment_restart: "实验重启"
  tr_martis_experiment_restart_desc: "重启火星重建时期中断的实验项目，全面加速科研进度并拓宽研究视野。"
  tr_martis_data_surge: "数据涌流"
  tr_martis_data_surge_desc: "建立荧惑数据网络，以计算科学为核心加速所有领域的研究突破。"
  tr_martis_universal_formula: "万物公式"
  tr_martis_universal_formula_desc: "科研与探索的终极汇聚——万物皆可量化，万物皆可推演。科学家容量提升，经验获取加速。"
  tr_martis_stellar_survey: "星域探查"
  tr_martis_stellar_survey_desc: "部署荧惑派独创的广域扫描阵列，大幅提升勘测速度和异常发现概率。"
  tr_martis_anomaly_affinity: "异常亲和"
  tr_martis_anomaly_affinity_desc: "荧惑科学家对宇宙异常有天生的亲和力，研究速度与发现概率远超常人。"

  # ── 鸾羽传统 ──
  tradition_phoenix: "鸾羽传统"
  tradition_phoenix_desc: "鸾羽军事派的武力信条：以舰队扩张掌控星海，以铁血锤炼锻造精锐。"
  tr_phoenix_adopt: "鸾羽列阵"
  tr_phoenix_adopt_desc: "鸾羽军事派的战备动员开始——舰船容量初步提升。"
  tr_phoenix_finish: "鸾羽凌霄"
  tr_phoenix_finish_desc: "鸾羽传统的终极成就：无可匹敌的舰队力量，凌驾星海之上。"
  tr_phoenix_fleet_expansion: "舰队扩编"
  tr_phoenix_fleet_expansion_desc: "大规模扩充舰队编制，增加舰船容量与指挥上限。"
  tr_phoenix_firepower: "火力优势"
  tr_phoenix_firepower_desc: "鸾羽号的火控系统升级，提升舰船射速与武器伤害。"
  tr_phoenix_hawk_strategy: "鹰眼战略"
  tr_phoenix_hawk_strategy_desc: "舰队与陆军的战略汇聚——以速度掌控战场节奏，以灵活脱离不利交战。"
  tr_phoenix_iron_discipline: "铁血锤炼"
  tr_phoenix_iron_discipline_desc: "鸾羽军令下的严酷训练体系，领袖成长更快，士气更加坚韧。"
  tr_phoenix_elite_ground: "精锐陆战"
  tr_phoenix_elite_ground_desc: "鸾羽号的精锐地面部队——伤害更高，生命更强，是星际战场的决定性力量。"

  # ===== 飞升天赋 · v0.4 =====
  ap_huisu_ascendant: "辉夙通达"
  ap_huisu_ascendant_desc: "辉夙博物馆已成为汉和文明鲜活的集体记忆。受过古档案法训练的官僚体系以空前效率治理，我们的遗产助推帝国扩张。"
  ap_martis_ascendant: "荧惑通达"
  ap_martis_ascendant_desc: "荧惑派的研究哲学已演进为全新范式。每位科学家都承载着火星的星火，不断突破已知边界。"
  ap_phoenix_ascendant: "鸾羽通达"
  ap_phoenix_ascendant_desc: "鸾羽舰队已超越其原始使命。指挥官肩负着流亡舰队的铁律，每艘战舰都在歌唱归乡的决心。"
  ap_ranshanxia_bloodline: "染山霞血脉"
  ap_ranshanxia_bloodline_desc: "汉和文明的三支血脉在此交汇。辉夙的智慧、荧惑的科研、鸾羽的力量融为一炉——我们真正归巢了。"
  requires_tradition_huisu_finish: "需要完成辉夙传统树。"
  requires_tradition_martis_finish: "需要完成荧惑传统树。"
  requires_tradition_phoenix_finish: "需要完成鸾羽传统树。"
  requires_any_faction_ascendant: "需要拥有任意派系飞升天赋（辉夙/荧惑/鸾羽）。"

  # ===== 派系事件 · v0.4 =====

  # 辉夙派系事件 (5-7)
  event_homing.5.title: "档案中的回响"
  event_homing.5.desc: "辉夙博物馆深处的档案中，沉寂已久的声音开始骚动。我们保存的先祖记录不仅是数据——它们在诉说，承载着汉和黄金时代的梦想。我们的馆长报告：共鸣正在每个周期不断增强。"
  event_homing.5.opt.ancestors_speak: "聆听它们要说的话。"
  event_homing.6.title: "档案觉醒"
  event_homing.6.desc: "辉夙档案已完全觉醒。知识如水般流经我们的行政网络，我们的人民感到与遗产的联结焕然一新。博物馆不再是静态藏品——它已成为我们文明的活支柱。"
  event_homing.6.opt.integrate: "整合觉醒的档案。"
  event_homing.7.title: "遗产与未来"
  event_homing.7.desc: "随着档案共鸣加剧，来自过去的声息开始与当下交融。部分馆长警告说会迷失于怀旧，但多数人因背负的历史重量而感到振奋。我们必须选择这段遗产如何塑造我们的未来。"
  event_homing.7.opt.preserve: "守护我们所获。"

  # 荧惑派系事件 (8-10)
  event_homing.8.title: "首次发现"
  event_homing.8.desc: "我们的异常研究渠道取得突破——得到一枚远古技术碎片，其年代甚至早于汉和档案。荧惑科学家们振奋不已：这可能是我们起源比已知更久远的证据。"
  event_homing.8.opt.analyze: "分析这一发现。"
  event_homing.9.title: "火星之焰重燃"
  event_homing.9.desc: "碎片已解码，并携带一种模式——火星重建时期的印记。对荧惑派而言，这不只是技术：这是他们认为已逝于历史的星火重燃。对其士气的影响肉眼可见。"
  event_homing.9.opt.reignite: "重燃星火。"
  event_homing.10.title: "跨越已知"
  event_homing.10.desc: "火星之焰炽热重燃，科学家们以焕然一新的活力向前推进。发现如潮水般涌来，每一项都开启新的疑问。已知与未知的边界正在变薄——有人低语说，边界之外的一切或将改变一切。"
  event_homing.10.opt.beyond: "跨越边界。"

  # 鸾羽派系事件 (11-13)
  event_homing.11.title: "舰队记忆"
  event_homing.11.desc: "在一次例行巡逻中，鸾羽舰队的战舰开始在所有频道广播——不是奉命，而是乘员们描述为集体记忆。传输包含着它们执行归巢计划原始使命的碎片，本认为早已失落。舰队已不再只是战舰与水兵——它们背负着流亡的重量。"
  event_homing.11.opt.honor: "致敬这份记忆。"
  event_homing.12.title: "铁律与活着的记忆"
  event_homing.12.desc: "舰队范围的广播已被解析。这不是故障而是显化：鸾羽战舰在太阳爆炸的熔炉中锻造，记得它们为何而建。仅凭铁律无法支撑它们走过数世纪——但铁律加上共同目的可以。舰队已进化。"
  event_homing.12.opt.strengthen: "强化所浮现者。"
  event_homing.13.title: "归巢的承诺"
  event_homing.13.desc: "鸾羽舰队整装待发。它们的纪律比以往任何时候都锋利，其使命因流亡记忆而焕然一新。它们不再只为生存而战——它们为履行出生前的承诺而战。归途在前。"
  event_homing.13.opt.lead: "领它们归巢。"

  # 汇聚链事件 (14-16)
  event_homing.14.title: "三脉汇聚"
  event_homing.14.desc: "辉夙的遗产、荧惑的科研、鸾羽的力量在此交织。染山霞血脉——以曾经温暖先祖苍穹的大气现象命名——此刻流经每一位汉和公民。我们不再是寻求归巢的流亡者：我们是命运本身的继承者。"
  event_homing.14.opt.convergence: "拥抱汇聚。"
  event_homing.15.title: "归巢成真"
  event_homing.15.desc: "三脉汇聚完成了汉和创想者从未设想之事：它治愈了我们民族灵魂的裂痕。千年的流亡从未被遗忘——怎么可能遗忘？——但它不再定义我们。我们不再是逃离黑暗的太阳系幸存者。我们作为一体民族，承载三种愿景走向同一黎明。"
  event_homing.15.opt.realization: "拥抱真理。"
  event_homing.16.title: "归巢完成"
  event_homing.16.desc: "归巢计划已达成其目的。汉和文明找到了它们从未失去之物：群星中配得上先祖与子孙的家园。旅程未终——宇宙浩瀚——但千年来第一次，我们不再独自流浪。"
  event_homing.16.opt.closure: "展望未来。"

