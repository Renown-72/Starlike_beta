  # 异常 — 归巢地球星尘
  anomaly_homing_earth_stardust_desc: "这颗曾被称为"地球"的星球，已变成了一颗恒星，微弱的能量信号从中脉动，仿佛星球仍记得它曾经的模样。"

  # 游戏概念
  concept_sl_origin_homing: "归巢计划"
  concept_sl_origin_homing_desc: "归巢计划是汉和文明的起源故事——太阳系灾变的幸存者在火星上重建家园，如今寻求回归群星中的祖居。三大派系引领旅程：辉夙（遗产）、荧惑（科学）和鸾羽（军事）。"
  concept_sl_huisu: "辉夙派"
  concept_sl_huisu_desc: "博物传承派。辉夙档案官保存汉和文明的集体记忆，从过去汲取力量引导未来。其传统树聚焦凝聚力、考古学和行政效率。"
  concept_sl_martis: "荧惑派"
  concept_sl_martis_desc: "荧惑科学派。荧惑研究员承载火星时代的实验之火，不断突破物理和工程的边界。其传统树聚焦科研速度、异常分析和科学探索。"
  concept_sl_phoenix: "鸾羽派"
  concept_sl_phoenix_desc: "鸾羽军事派。鸾羽指挥官传承最初撤离舰队的铁律。其传统树聚焦舰队扩张、武器系统和地面作战优势。"
  concept_sl_ranshanxia: "染山霞血脉"
  concept_sl_ranshanxia_desc: "染山霞血脉是汉和三大派系传统的汇聚。以曾温暖旧地球苍穹的大气现象命名，代表遗产、科学和力量的统一。"
  concept_sl_homing_tradition: "归巢传统"
  concept_sl_homing_tradition_desc: "每个汉和派系拥有自己的传统树，由对应国策解锁。完成传统树将解锁对应的派系飞升天赋和一座帝国唯一建筑。"

  # 开屏消息
  origins_sl_homing_start_screen: "§H归巢计划§!\n\n千年之前，太阳系被恒星之火吞噬。幸存者——工程师、学者、军人——逃往火星重建家园。他们称之为归巢计划：终有一日，我们将找到回去的路。\n\n如今，三大派系引领着汉和文明：§Y辉夙§!，记忆的守护者；§Y荧惑§!，科学之火的承载者；§Y鸾羽§!，铁律舰队的卫士。\n\n群星在等待。归巢之旅，启程。"

  # ===== v0.5 血脉修正器 =====
  sl_bloodline_full: "星语者血脉"
  sl_bloodline_full_desc: "Sol 灾变中最后的恒星编码基因携带者。血脉赋予对异常和宇宙现象的非凡亲和力。"
  sl_bloodline_fallen: "陨落的血脉"
  sl_bloodline_fallen_desc: "星语者已逝。文明集体记忆中只残留着血脉微弱的回响。"
  sl_bloodline_eternal: "永恒的血脉"
  sl_bloodline_eternal_desc: "通过染山霞飞升，血脉超越了凡躯的桎梏。其力量甚至超越了最初的恒星编码。"
  sl_rebellion_aftermath: "叛乱余波"
  sl_rebellion_aftermath_desc: "星语者的陨落动摇了帝国的根基。恢复秩序需要时间。"

  # ===== v0.5 政策 =====
  sl_stellarite_policy: "星尘研究方针"
  sl_stellarite_policy_desc: "决定帝国如何在续命和科研发展之间分配星尘资源。"
  sl_stellarite_survival_first: "续命优先"
  sl_stellarite_survival_first_desc: "所有星尘产出优先用于维持星语者的生命。科研受损。"
  sl_stellarite_balanced: "均衡分配"
  sl_stellarite_balanced_desc: "星尘在生存和发展之间均匀分配。"
  sl_stellarite_progress_first: "发展优先"
  sl_stellarite_progress_first_desc: "科研优先于续命。星语者的存亡退居次要。"
  sl_faction_governance: "派系治理方针"
  sl_faction_governance_desc: "决定星语者与三大派系之间的权力结构。"
  sl_governance_autocracy: "星语者独断"
  sl_governance_autocracy_desc: "星语者以绝对权威统治。派系声音仅作参考。"
  sl_governance_council: "议会共治"
  sl_governance_council_desc: "三大派系领袖与统治者共享治权。稳定性提升但执行力被稀释。"
  sl_governance_dominant: "优势派系主导"
  sl_governance_dominant_desc: "执政派系的国策凌驾于其他派系之上，集中权力但滋生不满。"
