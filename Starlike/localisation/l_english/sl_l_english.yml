  #起源相关
  origin_homing: "Project Homing"
  origin_homing_desc: "A thousand-year quest burns in one day's flame,Never dare we forget the primal claim;By sacred oath our destinies are sworn,To forge a new heaven before the morn \"The sons and daughters of COPAN still stand today, but will they follow their lord into a second dawn?\"\n$SL_LABEL$"
  origin_tooltip_projece_homing_effects: "Our StarWhisper bloodline grants heightened sensitivity to the cosmos: anomalies are more readily discovered and resolved. Survey vessels move faster through uncharted systems. The scattered knowledge of our lost homeworld accelerates research. One additional research alternative is available."
  origin_tooltip_project_homing_negative_effects: "The long exile has cost us dearly: our leader pool is depleted, leaving fewer capable commanders and scientists to draw from."

  # 恒星系相关
  homing_earth_NAME: "Project Homing Earth"
  homing_earth_DESC: "This is the starting star system for those who choose the Project Homing origin.\n\nIt determines the layout of your initial star system, though its precise location in the galaxy is not fixed."
  NAME_Homing_Earth: "Homing Earth"

  # 事件链相关
  event_homing.2.title: "Stellar Dust Homeworld"
  event_homing.2.desc: "The planet designated Homing Earth — turned to stellar dust millennia ago — pulses with an anomalous signal unlike any we have encountered. Our ancient civilization, it seems, still lingers here."
  event_homing.2.opt.investigate: "Investigate the anomalous signal."
  event_homing.2.opt.defer: "Defer the investigation."

  event_homing.3.title: "Echoes of Home"
  event_homing.3.desc: "Our scientists have decoded fragments of the anomaly's transmission. It contains the architectural schematics of our ancestors — scattered across the void, waiting to be found. The archive is incomplete, but the knowledge within is invaluable."
  event_homing.3.opt.archive: "Archive the knowledge for future generations."
  event_homing.3.opt.decode: "Decode the schematics immediately."

  event_homing.4.title: "StarWhisper Legacy"
  event_homing.4.desc: "The full archive has been unlocked. Among the recovered data are records of a navigational beacon — a device capable of sensing anomalies across the galaxy. This is the legacy of the StarWhispers."
  event_homing.4.opt.accept: "Accept the legacy."
  event_homing.4.opt.decline: "Some knowledge is better left sealed."

  # 专属修正
  homing_earth_memories: "Memories of Homing Earth"
  homing_earth_memories_desc: "Fragments of our ancestral archive have been recorded, bolstering unity and resolve."
  homing_legacy: "StarWhisper Legacy"
  homing_legacy_desc: "The decoded archive of Homing Earth grants enhanced research and unity through our shared heritage."

  # 专属科学家特质
  trait_scientist_stellarite_touched: "Stellarite-Touched"
  trait_scientist_stellarite_touched_desc: "Touched by the stellar dust of their ancestors, this scientist is exceptionally attuned to cosmic anomalies."

  # COPAN 派系国策
  civic_huisu: "Huisu Orthodoxy"
  civic_huisu_desc: "The core crew of Project Homing — curators from the museum and administrators of the Huisu central government. They govern with an emphasis on heritage and administrative efficiency, maintaining civilization's memory and identity through the long exile."
  civic_huisu_effects: "§H+25%§! Archaeology Speed\n§H+15%§! Relic Energy Production\n§H+15%§! Unity Production\n§H+10§! Edict Fund\n§R-10%§! Naval Capacity"
  civic_huisu_negative_effects: ""
  civic_martis: "Rising Fervor"
  civic_martis_desc: "A group of science officers who rose to prominence during the Mars reconstruction era. Their guiding principle: the flame of knowledge must burn eternal. Their supporters call themselves the Fervor Faction, guiding civilization's survival through collective wisdom."
  civic_martis_effects: "§H+10%§! Research Speed\n§H+20%§! Survey Speed\n§H+20%§! Anomaly Research Speed\n§R-1§! Leader Pool Size"
  civic_martis_negative_effects: ""
  civic_phoenix_plume: "Luanyu"
  civic_phoenix_plume_desc: "Originally an armed force dispatched by the Central Hanhe to oversee Project Homing, nominally under Huisu central command. After an accident transported them to the stars, they protect civilization with iron discipline and military order, valuing strength above all."
  civic_phoenix_plume_effects: "§H+20%§! Naval Capacity\n§H+25%§! Leader Experience Gain\n§H+15%§! Army Damage\n§R-5%§! Unity Production"
  civic_phoenix_plume_negative_effects: ""
  councilor_huisu: "Huisu Minister"
  councilor_huisu_desc: "The Huisu Minister coordinates all administrative affairs of the Commonwealth, representing the civilization's core values."
  councilor_martis: "Fervor Science Director"
  councilor_martis_desc: "The Fervor Science Director leads the Commonwealth's research mandate, carrying forward the scientific legacy of the Mars reconstruction era."
  councilor_phoenix_plume: "Luanyu Fleet Admiral"
  councilor_phoenix_plume_desc: "The Luanyu Fleet Admiral commands the Commonwealth's military forces, embodying the iron discipline of the Luanyu vessel."

  # 异常 — 归巢地球星尘
  anomaly_homing_earth_stardust_desc: "This planet — once called Earth — has been transmuted into stellar dust. Yet faint energy signatures pulse from within, as though the planet remembers what it was."

  # 内阁议程
  council_agenda_agenda_huisu_name: "Museum Archival Initiative"
  council_agenda_agenda_huisu_desc: "Prioritize archival recovery and cultural heritage preservation. Focus resources on archaeological research and unity-building through shared history."
  council_agenda_agenda_martis_name: "Science First Protocol"
  council_agenda_agenda_martis_desc: "Accelerate all research programs and survey operations. Channel the scientific legacy of the Mars reconstruction era into systematic galactic exploration."
  council_agenda_agenda_phoenix_plume_name: "Military Expansion Decree"
  council_agenda_agenda_phoenix_plume_desc: "Expand naval capacity and strengthen ground forces. Luanyu military doctrine demands vigilance against all threats."

  # ===== Species · Hanhe =====
  SPECIES_homing_han: "Commonwealth Human"
  trait_stellarite_adapted: "Stellarite Adaptation"
  trait_stellarite_adapted_desc: "After millennia of adaptation to space habitats and the Martian environment, this species has developed exceptional tolerance for extreme conditions and a deep instinct for collective cohesion."
  trait_stellarite_touched: "Heritage Instinct"
  trait_stellarite_touched_desc: "The spirits of their ancestors seem to linger in the stellar dust, granting this species heightened sensitivity to ancient ruins and cosmic anomalies."

  # ===== Tradition Trees =====

  # ── Huisu Traditions ──
  tradition_huisu: "Huisu Traditions"
  tradition_huisu_desc: "The governance philosophy of the Huisu archivists: rebuild administration to maintain order, preserve heritage through martial tradition."
  tr_huisu_adopt: "Archival Awakening"
  tr_huisu_adopt_desc: "Begin the path of Huisu heritage, guided by archaeological wisdom toward civilizational renewal."
  tr_huisu_finish: "Eternal Archive"
  tr_huisu_finish_desc: "The ultimate achievement of the Huisu tradition: a perfect fusion of administration and arms, ushering in a new era."
  tr_huisu_admin_rebuild: "Administrative Reconstruction"
  tr_huisu_admin_rebuild_desc: "Streamline redundant bureaucratic layers with museum-grade precision, reducing the administrative burden of empire."
  tr_huisu_cultural_unity: "Cultural Unity"
  tr_huisu_cultural_unity_desc: "Transform the shared memory of exile into a wellspring of civilizational cohesion, uniting all under one banner."
  tr_huisu_edict_tradition: "Edict Tradition"
  tr_huisu_edict_tradition_desc: "Restore the Huisu central edict system, issuing more decrees at lower cost to maintain efficient governance."
  tr_huisu_heritage_arms: "Heritage Armaments"
  tr_huisu_heritage_arms_desc: "Close-combat techniques and fortification arts passed down through generations of Huisu guards, granting formidable ground strength."
  tr_huisu_relic_guardian: "Relic Guardian"
  tr_huisu_relic_guardian_desc: "Elite guards dedicated to protecting relics and archives, especially fearsome in defensive engagements."

  # ── Martis Traditions ──
  tradition_martis: "Martis Traditions"
  tradition_martis_desc: "The creed of the Martis science faction: push research through experimentation, expand the frontier through exploration."
  tr_martis_adopt: "Martis Expedition"
  tr_martis_adopt_desc: "Embark on the Martis path of knowledge, surveying the unknown with greater speed."
  tr_martis_finish: "Martis Illumination"
  tr_martis_finish_desc: "The ultimate achievement of Martis tradition: twin breakthroughs in research and exploration illuminate the path ahead."
  tr_martis_experiment_restart: "Experiment Restart"
  tr_martis_experiment_restart_desc: "Resume experiments interrupted during the Mars reconstruction, accelerating all research and broadening horizons."
  tr_martis_data_surge: "Data Surge"
  tr_martis_data_surge_desc: "Establish the Martis data network, leveraging computational science to accelerate breakthroughs across all fields."
  tr_martis_universal_formula: "Universal Formula"
  tr_martis_universal_formula_desc: "The ultimate convergence of research and exploration — all things can be quantified, all things can be predicted. Increases scientist capacity and experience gain."
  tr_martis_stellar_survey: "Stellar Survey"
  tr_martis_stellar_survey_desc: "Deploy the Martis faction's proprietary wide-field scanning array, dramatically increasing survey speed and anomaly discovery."
  tr_martis_anomaly_affinity: "Anomaly Affinity"
  tr_martis_anomaly_affinity_desc: "Martis scientists possess an innate affinity for cosmic anomalies, with research speed and discovery rates far exceeding the norm."

  # ── Phoenix Traditions ──
  tradition_phoenix: "Luanyu Traditions"
  tradition_phoenix_desc: "The martial creed of the Luanyu faction: command the stars through fleet expansion, forge the elite through iron discipline."
  tr_phoenix_adopt: "Phoenix Formation"
  tr_phoenix_adopt_desc: "The Luanyu military mobilization begins — initial naval capacity increase."
  tr_phoenix_finish: "Phoenix Ascendant"
  tr_phoenix_finish_desc: "The ultimate achievement of Luanyu tradition: an unmatched fleet force, supreme across the stars."
  tr_phoenix_fleet_expansion: "Fleet Expansion"
  tr_phoenix_fleet_expansion_desc: "Massively expand fleet organization, increasing naval capacity and command limit."
  tr_phoenix_firepower: "Firepower Supremacy"
  tr_phoenix_firepower_desc: "Upgraded fire control systems from the Luanyu vessel, improving ship fire rate and weapon damage."
  tr_phoenix_hawk_strategy: "Hawk Strategy"
  tr_phoenix_hawk_strategy_desc: "Strategic convergence of fleet and army — control the battlefield tempo through speed, disengage from unfavorable engagements with agility."
  tr_phoenix_iron_discipline: "Iron Discipline"
  tr_phoenix_iron_discipline_desc: "The harsh training regimen under Luanyu military command — leaders grow faster, morale stands firmer."
  tr_phoenix_elite_ground: "Elite Ground Forces"
  tr_phoenix_elite_ground_desc: "The Luanyu's elite ground troops — higher damage, greater resilience, the decisive force on any battlefield."

